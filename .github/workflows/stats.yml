name: Generate Stats SVG

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone and build github-readme-stats
        run: |
          git clone https://github.com/anuraghazra/github-readme-stats.git grs
          cd grs
          npm install

      - name: Generate Stats SVG
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p dist
          cd grs
          node -e "
          const { renderStatsCard } = require('./src/cards/stats-card.js');
          const { fetchStats } = require('./src/fetchers/stats-fetcher.js');
          const themes = require('./themes/index.js');
          
          (async () => {
            try {
              const stats = await fetchStats('rahibladex', true, true, [], true);
              const card = renderStatsCard(stats, {
                hide_title: false,
                hide_rank: false,
                show_icons: true,
                include_all_commits: true,
                count_private: true,
                disable_animations: false,
                theme: 'dracula',
                locale: 'en',
                hide_border: false,
              });
              require('fs').writeFileSync('../dist/stats.svg', card);
              console.log('Stats SVG generated successfully');
            } catch (e) {
              console.error('Error:', e.message);
              process.exit(1);
            }
          })();
          "

      - name: Push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}